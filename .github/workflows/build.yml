name: Build

on:
  push:
    branches: [master, main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # A newer push makes the build of an older one pointless; a deploy already running is never cut off.
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;37.0.0 ndk;30.0.16248370

      - uses: gradle/actions/setup-gradle@v4

      - name: Release key
        env:
          KEYSTORE: ${{ secrets.BLESK_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "BLESK_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      # The screenshots of the latest release are the reference this build's are compared with.
      - name: Reference screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/screenshots.py fetch

      - name: Check, test and build
        env:
          BLESK_KEYSTORE_PASSWORD: ${{ secrets.BLESK_KEYSTORE_PASSWORD }}
          BLESK_KEY_ALIAS: ${{ secrets.BLESK_KEY_ALIAS }}
          BLESK_KEY_PASSWORD: ${{ secrets.BLESK_KEY_PASSWORD }}
        run: |
          # Without it tee's success would hide a failed test or detekt, and the release would go out.
          set -o pipefail
          ./gradlew --console=plain --continue \
            detekt testDebugUnitTest :shared:test :detekt-rules:test :server:test :server:installDist \
            :app:compareRoborazziDebug :app:assembleRelease \
            -Pblesk.versionCode=${{ github.run_number }} \
            -Pblesk.versionSuffix=-build.${{ github.run_number }} \
            2>&1 | tee "$RUNNER_TEMP/gradle.log"

      - name: Explain the failure
        if: failure()
        run: bash scripts/ci/explain-failure.sh "$RUNNER_TEMP/gradle.log"

      # Nothing after this step signs anything, and the actions below need not see the key.
      - name: Forget the release key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Check screenshots against the reference
        run: python3 scripts/ci/screenshots.py check "$RUNNER_TEMP/screenshots"

      - name: Two clients through the real server
        run: bash scripts/ci/integration.sh

      - name: Allow the emulator to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The image download breaks now and then ("unknown archive"); the emulator action does not retry it.
      - name: Emulator image
        run: |
          for attempt in 1 2 3; do
            yes | sdkmanager --install emulator 'system-images;android-34;google_apis;x86_64' >/dev/null &&
              [ -f "$ANDROID_HOME/system-images/android-34/google_apis/x86_64/system.img" ] && exit 0
            echo "::warning::The emulator image did not install, try $attempt of 3"
            rm -rf "$ANDROID_HOME/system-images/android-34/google_apis/x86_64"
            sleep 20
          done
          exit 1

      - name: Release APK on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/ci/smoke.sh app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/smoke"

      - name: Collect release files
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/blesk.apk
          cp "$RUNNER_TEMP"/screenshots/*.png "$RUNNER_TEMP/screenshots/screenshots.zip" out/
          # The VPS takes this instead of building: scripts/deploy.sh, fetch_server.
          tar -czf out/blesk-server.tar.gz -C server/build/install blesk-server
          # Version, size and checksums of the APK for the site and for scripts/deploy.sh.
          bash scripts/ci/release-json.sh out/blesk.apk > out/release.json
          cat out/release.json

      - name: Check the site
        run: python3 scripts/build-site.py --out "$RUNNER_TEMP/site" --release out/release.json --check

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            app/build/outputs/roborazzi/
            ${{ runner.temp }}/smoke/

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${{ github.run_number }}"
          # The app installs an update only if its SHA-256 matches this line and the key matches its own.
          apk_sha=$(jq -r .apkSha256 out/release.json)
          signer=$(jq -r .signerSha256 out/release.json)
          {
            cat docs/RELEASE_NOTES.md
            echo
            echo "Ветка: \`${GITHUB_REF_NAME}\`, коммит: \`${GITHUB_SHA::7}\`"
            echo
            echo "SHA-256 APK: \`$apk_sha\`"
            echo "Ключ подписи (SHA-256): \`$signer\`"
            echo
            cat "$RUNNER_TEMP/screenshots/summary.txt"
          } > notes.md
          gh release create "$tag" out/* \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "blesk $(sed -n 's/^## //p' docs/RELEASE_NOTES.md | head -1) (сборка ${{ github.run_number }})" \
            --notes-file notes.md

  # Puts this build on the server: the API at api.blesk.su and the site at blesk.su, then checks both
  # from outside. Pushes only, since GitHub runs schedules and manual runs on the default branch alone.
  deploy:
    needs: apk
    if: >-
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/master' ||
      github.ref == 'refs/heads/claude/file-review-0lky6f'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Check the deploy secrets
        id: secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -n "$VPS_HOST" ] && [ -n "$VPS_USER" ] && [ -n "$VPS_SSH_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Secrets VPS_HOST, VPS_USER and VPS_SSH_KEY are not set yet, the server is left as it is"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.secrets.outputs.ready == 'true'

      - name: Deploy over SSH
        if: steps.secrets.outputs.ready == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          BLESK_BRANCH: ${{ github.ref_name }}
          BLESK_COMMIT: ${{ github.sha }}
          BLESK_DOMAIN: api.blesk.su
          BLESK_SITE_DOMAIN: blesk.su
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_REGION: ${{ secrets.BACKUP_S3_REGION }}
          BACKUP_S3_ACCESS_KEY: ${{ secrets.BACKUP_S3_ACCESS_KEY }}
          BACKUP_S3_SECRET_KEY: ${{ secrets.BACKUP_S3_SECRET_KEY }}
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
        run: bash scripts/ci/remote-deploy.sh

      - name: Check the server from outside
        if: steps.secrets.outputs.ready == 'true'
        run: bash scripts/ci/check-live.sh api.blesk.su blesk.su
