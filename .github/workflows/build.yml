name: Build

on:
  push:
    branches: [master, main, 'claude/**']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;37.0.0 ndk;30.0.16248370

      - uses: gradle/actions/setup-gradle@v4

      - name: Release key
        env:
          KEYSTORE: ${{ secrets.BLESK_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "BLESK_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Check, test and build
        env:
          BLESK_KEYSTORE_PASSWORD: ${{ secrets.BLESK_KEYSTORE_PASSWORD }}
          BLESK_KEY_ALIAS: ${{ secrets.BLESK_KEY_ALIAS }}
          BLESK_KEY_PASSWORD: ${{ secrets.BLESK_KEY_PASSWORD }}
        run: >
          ./gradlew --console=plain
          detekt testDebugUnitTest :server:test :app:recordRoborazziDebug :app:assembleRelease
          -Pblesk.versionCode=${{ github.run_number }}
          -Pblesk.versionSuffix=-build.${{ github.run_number }}

      - name: Collect release files
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/blesk.apk
          cp app/build/screenshots/*.png out/

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: '**/build/reports/'

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${{ github.run_number }}"
          # The app installs an update only if its SHA-256 matches this line and the key matches its own.
          apk_sha=$(sha256sum out/blesk.apk | cut -d' ' -f1)
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner
          signer=$("$apksigner" verify --print-certs out/blesk.apk | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1)
          {
            cat docs/RELEASE_NOTES.md
            echo
            echo "Ветка: \`${GITHUB_REF_NAME}\`, коммит: \`${GITHUB_SHA::7}\`"
            echo
            echo "SHA-256 APK: \`$apk_sha\`"
            echo "Ключ подписи (SHA-256): \`$signer\`"
          } > notes.md
          gh release create "$tag" out/* \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "blesk $(sed -n 's/^## //p' docs/RELEASE_NOTES.md | head -1) (сборка ${{ github.run_number }})" \
            --notes-file notes.md
