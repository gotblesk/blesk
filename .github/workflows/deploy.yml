name: Deploy server

on:
  workflow_dispatch:
    inputs:
      domain:
        description: Domain for the server (leave empty to keep the current setting)
        required: false
        default: ''

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          BRANCH: ${{ github.ref_name }}
          DOMAIN: ${{ inputs.domain }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "::error::Secrets VPS_HOST, VPS_USER and VPS_SSH_KEY are required"
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 15 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          domain_env=""
          if [ -n "$DOMAIN" ]; then domain_env="BLESK_DOMAIN=$(printf '%q' "$DOMAIN")"; fi

          # On a fresh server the script is not there yet, so the first run fetches it from GitHub.
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" bash -s <<EOF
          set -euo pipefail
          script=/opt/blesk/scripts/deploy.sh
          if [ ! -f "\$script" ]; then
            script=\$(mktemp)
            curl -fsSL "https://raw.githubusercontent.com/$REPOSITORY/$BRANCH/scripts/deploy.sh" -o "\$script"
          fi
          sudo_cmd=""
          if [ "\$(id -u)" != 0 ]; then sudo_cmd="sudo -n"; fi
          \$sudo_cmd env BLESK_BRANCH=$(printf '%q' "$BRANCH") $domain_env bash "\$script"
          EOF
