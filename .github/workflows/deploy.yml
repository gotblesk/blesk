name: Deploy server

# Every build of main, master or the working branch deploys by itself (build.yml, job deploy). This
# one is for doing it by hand: again, onto another host, from the backup, or with other domains.
on:
  workflow_dispatch:
    inputs:
      domain:
        description: API domain (empty keeps the server's current setting)
        required: false
        default: api.blesk.su
      site_domain:
        description: Site domain (empty keeps the server's current setting)
        required: false
        default: blesk.su
      host:
        description: Another server to install on (IP); empty means the VPS_HOST secret
        required: false
        default: ''
      restore:
        description: Move the data here from the newest backup (only onto a clean server)
        type: boolean
        default: false

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      # The pinned host key belongs to VPS_HOST; another host is taken by the key it presents, with a
      # warning in the log.
      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ inputs.host || secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ inputs.host == '' && secrets.VPS_KNOWN_HOSTS || '' }}
          BLESK_BRANCH: ${{ github.ref_name }}
          BLESK_COMMIT: ${{ github.sha }}
          BLESK_DOMAIN: ${{ inputs.domain }}
          BLESK_SITE_DOMAIN: ${{ inputs.site_domain }}
          BLESK_RESTORE: ${{ inputs.restore && 'latest' || '' }}
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_REGION: ${{ secrets.BACKUP_S3_REGION }}
          BACKUP_S3_ACCESS_KEY: ${{ secrets.BACKUP_S3_ACCESS_KEY }}
          BACKUP_S3_SECRET_KEY: ${{ secrets.BACKUP_S3_SECRET_KEY }}
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
        run: bash scripts/ci/remote-deploy.sh

      # The domains point at VPS_HOST, so another host cannot be checked through them yet.
      - name: Check the server from outside
        if: inputs.host == '' && inputs.domain != '' && inputs.site_domain != ''
        env:
          API_DOMAIN: ${{ inputs.domain }}
          SITE_DOMAIN: ${{ inputs.site_domain }}
        run: bash scripts/ci/check-live.sh "$API_DOMAIN" "$SITE_DOMAIN"
