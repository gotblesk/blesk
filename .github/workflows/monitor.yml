name: Monitor

# Every quarter of an hour, from outside the server: the API answers /health and the site opens. When
# either stops, an issue «Сервер не отвечает» is opened, and GitHub mails it to the owner; when both
# answer again, the issue is closed with the time it took. GitHub runs schedules from the default
# branch only (NEEDS_HUMAN.md, 2.4).
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: monitor
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  API: api.blesk.su
  SITE: blesk.su
  TITLE: Сервер не отвечает

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Ask the server
        id: probe
        run: |
          # Three tries a minute apart: one lost packet is not an outage.
          for attempt in 1 2 3; do
            api_code=$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' "https://$API/health" || true)
            site_code=$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' "https://$SITE/" || true)
            if [ "$api_code" = 200 ] && [ "$site_code" = 200 ]; then
              echo "down=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            [ "$attempt" = 3 ] || sleep 60
          done
          echo "down=true" >> "$GITHUB_OUTPUT"
          # curl writes 000 when nothing answered at all.
          echo "detail=$API/health: ${api_code/#000/нет ответа}, $SITE: ${site_code/#000/нет ответа}" >> "$GITHUB_OUTPUT"

      - name: Tell the owner
        env:
          GH_TOKEN: ${{ github.token }}
          DOWN: ${{ steps.probe.outputs.down }}
          DETAIL: ${{ steps.probe.outputs.detail }}
        run: |
          open=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" --json number,title \
            --jq "map(select(.title == env.TITLE)) | .[0].number // empty")
          now=$(TZ=Europe/Moscow date '+%d.%m.%Y %H:%M')
          if [ "$DOWN" = true ]; then
            if [ -z "$open" ]; then
              {
                # The mention makes GitHub send the mail even if repository notifications are off.
                echo "@$GITHUB_REPOSITORY_OWNER, $now (МСК) сервер перестал отвечать: $DETAIL."
                echo
                echo "Что сделать: на ноутбуке открой Терминал и выполни"
                # shellcheck disable=SC2016 # a PowerShell command for the owner, printed as it is
                printf '%s\n' 'cd $HOME\blesk; powershell -ExecutionPolicy Bypass -File scripts\owner\server-ssh.ps1 status'
                echo
                echo "Проверка повторяется каждые 15 минут. Когда сервер ответит, это обращение закроется само."
              } > body.md
              gh issue create -R "$GITHUB_REPOSITORY" --title "$TITLE" --body-file body.md
            fi
            echo "::error::$DETAIL"
            exit 1
          fi
          if [ -n "$open" ]; then
            gh issue close -R "$GITHUB_REPOSITORY" "$open" --comment "$now (МСК) сервер снова отвечает."
          fi
