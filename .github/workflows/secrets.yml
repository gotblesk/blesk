name: Secrets

on:
  push:
    branches: [master, main, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: 8.21.2
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history: a password removed from the tree is still in every older commit.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/$archive"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $archive\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan the history
        run: |
          set +e
          gitleaks git . --config .gitleaks.toml --redact --no-banner \
            --report-format json --report-path "$RUNNER_TEMP/leaks.json"
          status=$?
          set -e
          # Annotations show where a leak is without printing it: visible on the run page and through
          # the checks API, so a finding can be read without access to the logs.
          if [ -s "$RUNNER_TEMP/leaks.json" ]; then
            jq -r '.[] | "::error file=\(.File),line=\(.StartLine)::\(.RuleID) in commit \(.Commit[0:7])"' \
              "$RUNNER_TEMP/leaks.json"
          fi
          exit "$status"
