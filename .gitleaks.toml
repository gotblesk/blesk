# Default gitleaks rules, scanned over the whole history by .github/workflows/secrets.yml.
[extend]
useDefault = true

[allowlist]
description = "Leaks already reported to the owner for rotation (docs/NEEDS_HUMAN.md, 1.6); history keeps them"
paths = [
  '''^legacy/restart_server\.py$''',
  '''^legacy/test_smtp\.py$''',
]
