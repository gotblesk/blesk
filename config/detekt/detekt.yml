build:
  maxIssues: 0

complexity:
  LongParameterList:
    functionThreshold: 10
    constructorThreshold: 10
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Composable']
  LongMethod:
    threshold: 120
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    thresholdInFiles: 30
    thresholdInClasses: 25
    thresholdInObjects: 25
    ignorePrivate: true
  CyclomaticComplexMethod:
    threshold: 20
    ignoreAnnotated: ['Composable']

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'
  MatchingDeclarationName:
    active: false

style:
  MagicNumber:
    active: false
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
  WildcardImport:
    active: true
  MaxLineLength:
    maxLineLength: 140
  ReturnCount:
    max: 4
  ForbiddenComment:
    active: true
    comments:
      - value: 'TODO'
        reason: 'Finished code has no TODOs.'
      - value: 'FIXME'
        reason: 'Finished code has no FIXMEs.'

formatting:
  FunctionNaming:
    active: false
  MaximumLineLength:
    maxLineLength: 140
  TrailingCommaOnCallSite:
    active: false
  TrailingCommaOnDeclarationSite:
    active: false
  Filename:
    active: false
  ArgumentListWrapping:
    active: false
  MultiLineIfElse:
    active: false
  Wrapping:
    active: false
  ParameterListWrapping:
    active: false
  NoWildcardImports:
    active: true
  PropertyName:
    active: false
