# Started by scripts/deploy.sh, which also writes .env next to this file.
name: blesk

# Container logs go to the system journal, which scripts/deploy.sh keeps for seven days and caps in
# size; `docker compose logs` reads them back from there.
x-logging: &logging
  driver: ${BLESK_LOG_DRIVER:-journald}

services:
  postgres:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: blesk
      POSTGRES_USER: blesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/deploy.sh to create .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blesk -d blesk"]
      interval: 5s
      timeout: 5s
      retries: 30

  server:
    build:
      context: ..
      # server/Dockerfile.dist (written by deploy.sh) takes the server GitHub Actions built.
      dockerfile: ${BLESK_SERVER_DOCKERFILE:-server/Dockerfile}
    image: blesk-server:local
    restart: unless-stopped
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BLESK_PORT: "8080"
      BLESK_DB_URL: jdbc:postgresql://postgres:5432/blesk
      BLESK_DB_USER: blesk
      BLESK_DB_PASSWORD: ${POSTGRES_PASSWORD}
      # Attachments are end-to-end encrypted blobs, so plain files on the server's disk are enough.
      BLESK_STORAGE: fs
      BLESK_FS_DIR: /srv/blesk-attachments
      BLESK_TRUST_PROXY: "true"
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
    volumes:
      - server-tmp:/var/lib/blesk
      - attachments:/srv/blesk-attachments
    expose:
      - "8080"
    # Unhealthy is not restarted by Docker itself: the blesk-watchdog timer of scripts/deploy.sh does that,
    # so a server that hangs instead of crashing comes back too.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "5", "-o", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 2m

  caddy:
    image: caddy:2.11.7
    restart: unless-stopped
    logging: *logging
    depends_on:
      - server
      - livekit
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      BLESK_DOMAIN: ${BLESK_DOMAIN:-}
      BLESK_SITE_DOMAIN: ${BLESK_SITE_DOMAIN:-}
      BLESK_PUBLIC_IP: ${BLESK_PUBLIC_IP:-}
    volumes:
      - ./${BLESK_CADDYFILE:-Caddyfile.domain}:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      # The site from deploy.sh, which recreates Caddy after swapping a new build in.
      - ./site-dist:/srv/site:ro
      - caddy-data:/data
      - caddy-config:/config

  # Signalling goes through Caddy under /livekit; media flows directly on 7881/tcp and 50000-50100/udp.
  livekit:
    image: livekit/livekit-server:v1.13.7
    restart: unless-stopped
    logging: *logging
    command: ["--config", "/etc/livekit.yaml"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?run scripts/deploy.sh to create .env}: ${LIVEKIT_API_SECRET:?run scripts/deploy.sh to create .env}"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    expose:
      - "7880"
    ports:
      - "7881:7881"
      - "50000-50100:50000-50100/udp"

volumes:
  postgres-data:
  attachments:
  server-tmp:
  caddy-data:
  caddy-config:
