<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0e10" media="(prefers-color-scheme: dark)">
<meta name="referrer" content="no-referrer">
{{#noindex}}<meta name="robots" content="noindex">
{{/noindex}}{{#path}}<link rel="canonical" href="https://blesk.su{{path}}">
<meta property="og:url" content="https://blesk.su{{path}}">
{{/path}}<meta property="og:type" content="website">
<meta property="og:site_name" content="blesk">
<meta property="og:locale" content="ru_RU">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta name="twitter:card" content="summary">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/onest.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/site.css">
<script src="/assets/site.js" defer></script>
